---
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
  labels:
    app: gitlab
spec:
  replicas: 1
  strategy:
    type: Recreate            # never two pods writing the same PVC
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: gitlab
          # Pinned, never :latest — a defense must be reproducible, and an
          # upstream release landing between rehearsal and evaluation would
          # change the thing being graded. 19.3 is due ~2026-08-20.
          image: gitlab/gitlab-ce:19.2.1-ce.0
          env:
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                # This URL must be resolvable FROM INSIDE the cluster, because
                # Argo CD clones from it. <service>.<namespace>.svc.cluster.local
                external_url 'http://gitlab.gitlab.svc.cluster.local'
                gitlab_rails['initial_root_password'] = 'Passw0rd!42'
                gitlab_rails['gitlab_shell_ssh_port'] = 22
                # /-/health, /-/readiness and /-/liveness are IP-restricted and
                # answer 404 — not 403 — to any source outside this list. The
                # kubelet probes arrive from the CNI gateway (10.42.0.1), not
                # from loopback, so the default ['127.0.0.0/8'] makes every
                # probe fail forever: the pod never goes Ready and the
                # startupProbe kills the container every 30 minutes, restarting
                # `gitlab-ctl reconfigure` from zero. Throwaway cluster, so the
                # allowlist is fully open.
                gitlab_rails['monitoring_whitelist'] = ['0.0.0.0/0']
                # trim everything we do not need, to save RAM
                registry['enable'] = false
                gitlab_kas['enable'] = false
                prometheus_monitoring['enable'] = false
                puma['worker_processes'] = 2
                sidekiq['max_concurrency'] = 9
                nginx['worker_processes'] = 2
          ports:
            - name: http
              containerPort: 80
            - name: ssh
              containerPort: 22
          volumeMounts:
            - name: data
              mountPath: /var/opt/gitlab
              subPath: data
            - name: data
              mountPath: /etc/gitlab
              subPath: config
            - name: data
              mountPath: /var/log/gitlab
              subPath: logs
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
          # First boot runs `gitlab-ctl reconfigure` and can take 10+ minutes.
          # The startupProbe gives it up to 30 minutes before Kubernetes gives up.
          startupProbe:
            httpGet:
              path: /-/health
              port: 80
            failureThreshold: 90
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /-/health
              port: 80
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /-/health
              port: 80
            periodSeconds: 30
            failureThreshold: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitlab-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  type: ClusterIP
  selector:
    app: gitlab
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: ssh
      port: 22
      targetPort: 22
---
# Lets your browser reach GitLab on the SAME hostname Argo CD uses,
# through the k3d loadbalancer published on host port 80.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab
  namespace: gitlab
spec:
  rules:
    - host: gitlab.gitlab.svc.cluster.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitlab
                port:
                  number: 80